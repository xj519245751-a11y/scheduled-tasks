name: OKX MACD 扫描 V2

on:
  workflow_dispatch:
  schedule:
    - cron: '37 16,22,4,10 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run V2 script
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY_2 }}
        run: python mmain.py
