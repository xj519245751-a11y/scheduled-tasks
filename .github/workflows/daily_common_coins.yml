name: V2 + V4 Daily Common Coins

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 23:55（UTC 15:55）汇总当天共同出现的币种
    - cron: '55 15 * * *'

permissions:
  actions: read
  contents: read

jobs:
  daily-common-coins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Build and push daily common coin report
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_KEY_2: \${{ secrets.SERVERCHAN_KEY_2 }}
        run: python daily_common_coins.py
